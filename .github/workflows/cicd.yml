name: Todo App CI/CD

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        env:
          # SQLite — no real DB connection needed for generate
          DATABASE_URL: file:/tmp/ci.db
        run: npx prisma generate

      - name: Lint
        run: npm run lint

  build:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/todoapp2:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/todoapp2:latest
          cache-to: type=inline
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}

  deploy:
    needs: build
    runs-on: self-hosted
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create .env.production from GitHub Secrets
        # Created only on the runner machine at deploy time — never committed to git.
        run: |
          cat > .env.production <<EOF
          NODE_ENV=production

          # SQLite — persisted via Docker volume on the VPS
          DATABASE_URL=file:/app/data/prod.db

          # NextAuth — use your assigned domain
          NEXTAUTH_URL=https://e2526-wads-b4cc.csbihub.id
          NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}

          # Google OAuth
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          EOF

      - name: Login to Docker Hub (pull)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull Latest Image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/todoapp2:latest

      - name: Run DB Migrations
        # Run prisma migrate deploy inside a one-off container before swapping the app.
        run: |
          docker run --rm \
            --env-file .env.production \
            -v todoapp2_sqlite_data:/app/data \
            ${{ secrets.DOCKER_USERNAME }}/todoapp2:latest \
            npx prisma migrate deploy

      # Pull the new image and restart only the app service.
      - name: Deploy app
        run: |
          docker compose pull app
          docker compose up -d --no-deps app

      - name: Remove temporary env file
        if: always()
        run: rm -f .env.production

      - name: Cleanup dangling images
        run: docker image prune -f